name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/menu-save-scoring-v2, feature/google-play-preparation]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game behavior
        run: node --test tests/game.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Validate Play bundle and release lint
        run: gradle :app:bundleRelease :app:lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Neon-Blocks-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Neon-Blocks-AAB-preview-UNSIGNED
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Neon-Blocks-release-lint
          path: app/build/reports/lint-results-release.html
