plugins { id 'com.android.application' }

def uploadSigning = [
    storeFile: System.getenv('NEON_UPLOAD_STORE_FILE'),
    storePassword: System.getenv('NEON_UPLOAD_STORE_PASSWORD'),
    keyAlias: System.getenv('NEON_UPLOAD_KEY_ALIAS'),
    keyPassword: System.getenv('NEON_UPLOAD_KEY_PASSWORD')
]
def hasUploadSigning = uploadSigning.values().every { it != null && !it.trim().isEmpty() }
def hasPartialSigning = uploadSigning.values().any { it != null && !it.trim().isEmpty() }
if ((hasPartialSigning || System.getenv('NEON_REQUIRE_UPLOAD_SIGNING') == 'true') && !hasUploadSigning) {
    throw new GradleException('Upload signing is incomplete. Set all four NEON_UPLOAD_* signing variables. Do not use a debug key for Google Play.')
}

android {
    namespace 'com.neonblocks.classic'
    compileSdk 36

    defaultConfig {
        applicationId 'com.neonblocks.classic'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    signingConfigs {
        if (hasUploadSigning) {
            upload {
                storeFile rootProject.file(uploadSigning.storeFile)
                storePassword uploadSigning.storePassword
                keyAlias uploadSigning.keyAlias
                keyPassword uploadSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasUploadSigning) signingConfig signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
